name: Docker

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: kjake/base
  PLATFORMS: linux/386,linux/amd64,linux/arm64,linux/arm/v7,linux/ppc64le,linux/s390x,linux/riscv64

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Build and test the native image before anything is published, so a
      # broken rebuild never replaces the image that child containers use.
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          tags: localbuild/testimage:latest
          push: false
          load: true
      - name: Smoke test the image
        run: docker run --rm -v "$PWD/tests:/tests:ro" localbuild/testimage:latest bash /tests/smoke.sh
      - name: Compute date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ env.PLATFORMS }}
          # A dated tag lets child images pin a known-good snapshot of testing.
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.date.outputs.tag }}
          push: true
